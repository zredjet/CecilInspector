name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-dotnet installs the exact sdk.version from global.json and ignores rollForward,
      # so ask for the newest 10.0 SDK explicitly; global.json's latestFeature accepts it.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CecilInspector.slnx
      - run: dotnet build CecilInspector.slnx -c Release --no-restore
      - run: dotnet test CecilInspector.slnx -c Release --no-build --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
